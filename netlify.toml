# Netlify publishes the "deploy" folder, rebuilt by tools/build-deploy.sh on every push to main:
#   /                 -> the full TAILORMADE site       (site/index.html)
#   /experience/      -> the earlier single-page version (experience/index.html)
#   /showcase/        -> the case shelf                  (index.html)
#   /shopify-preview/ -> the Shopify sections preview    (shopify/preview/index.html)
[build]
  command = "sh tools/build-deploy.sh"
  publish = "deploy"

# the page checks for a newer build itself, so the HTML must never be cached
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
