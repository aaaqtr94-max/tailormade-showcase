<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAILORMADE · أشكال اللوقو 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Sample page only — nothing here is on the site.
   The same TM monogram as the site, in different 3D materials and motions, over a still of the film. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f3f1;color:#000;font-family:'Instrument Sans',system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
header{max-width:1100px;margin:0 auto 22px}
h1{font-size:20px;font-weight:500}
header p{color:#555;font-size:14px;margin-top:6px;line-height:1.6}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stage{position:relative;aspect-ratio:1/1;background:#2b2523;touch-action:pan-y;cursor:grab}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.meta{display:flex;align-items:baseline;gap:10px;padding:14px 16px}
.meta b{font-size:15px;font-weight:500;white-space:nowrap}
.meta span{color:#666;font-size:13px;line-height:1.5}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#000;color:#fff;font-size:13px;flex:0 0 auto}
.now{color:#8a6a3a!important}
.err{max-width:1100px;margin:0 auto;color:#a33}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<header>
  <h1>أشكال مختلفة للوقو TM بالـ 3D</h1>
  <p>نفس اللوقو في كل كرت، بس بخامة وحركة مختلفة. تقدر تسحب أي واحد بإصبعك أو بالماوس عشان تلفه. صفحة تجربة بس، والموقع ما تغير.</p>
</header>
<div class="grid" id="grid"></div>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {SVGLoader} from 'three/addons/loaders/SVGLoader.js';

const TM = 'M 616.2 618.2 C 614.6 619.8 614.5 705.5 616 706.5 C 616.6 706.9 618.7 705.9 620.6 704.3 C 622.6 702.8 624.9 701 625.9 700.5 C 626.8 699.9 628.6 698.7 630 697.9 C 643.9 688.9 648.9 685.9 660.3 679.6 C 682.2 667.7 719 652.9 744 646 C 746.5 645.3 750.5 644.2 753 643.5 C 761.9 641.1 772.7 638.9 783.8 637.5 C 798 635.6 838 635.4 839.8 637.2 C 840.7 638.1 841 708.1 841 946 C 841 1183.9 841.3 1253.9 842.2 1254.8 C 843.1 1255.7 854.6 1256 887.6 1256 L 931.8 1256 932.4 1253.8 C 932.7 1252.5 933 1177.8 933 1087.7 L 933 923.9 935.6 918.8 C 943.9 902.5 961 876.5 977.1 856 C 996.8 830.8 1022.7 806.3 1047 789.9 C 1077.4 769.3 1099.6 760.8 1134 756.6 C 1138.4 756 1148.9 757 1158 758.9 C 1174.1 762.2 1189.7 772.6 1201.5 788 C 1211.8 801.3 1219.4 823.8 1221.9 847.5 C 1222.7 855.5 1223 944.2 1223 1168.1 C 1223 1407.5 1223.3 1477.9 1224.2 1478.8 C 1225.5 1480.1 1308.2 1480.6 1311.4 1479.4 C 1312.9 1478.8 1313 1452.9 1313 1195.1 L 1313 911.4 1316.4 904.4 C 1337.4 860.6 1381.1 812.2 1424 785.4 C 1468.1 757.8 1509.6 749.5 1544.5 761.2 C 1566 768.4 1583.6 787.6 1590.5 811.5 C 1595.1 827.5 1595 819.1 1595 1158 C 1595 1405.2 1595.3 1477.9 1596.2 1478.8 C 1597.9 1480.5 1682.1 1480.5 1683.8 1478.8 C 1685.4 1477.2 1685.5 857.7 1684 840 C 1682.5 824 1679.5 810 1675.4 800.2 C 1674.6 798.4 1674 796.3 1674 795.6 C 1674 794.4 1671.8 790 1666.1 779.5 C 1659.9 768.1 1647.6 753.7 1637 745.6 C 1616.6 729.7 1604.1 723.8 1580.6 718.8 C 1567 716 1534.5 715.7 1520 718.4 C 1511.8 719.9 1506.8 721.1 1488.5 726 C 1475.4 729.5 1440.6 747.2 1418.4 761.6 C 1383.7 784.2 1347.4 821.6 1322.6 860.3 C 1318.8 866.2 1315.1 871 1314.4 871 C 1313.4 871 1313 869.6 1313 866.2 C 1313 852.7 1309.5 827.7 1305.6 812.7 C 1301.1 795.6 1291.8 776.1 1282.3 764 C 1272.1 751.1 1248.9 732.4 1237.2 727.7 C 1214.7 718.6 1204 716.7 1177.5 716.7 C 1156.1 716.7 1152.7 717.2 1129.5 722.4 C 1121.1 724.3 1105.4 729.7 1100 732.6 C 1097.5 733.9 1090.3 737.5 1084 740.6 C 1036.3 764 997.5 797 962.1 844.2 C 955.2 853.3 940.3 876.2 937.3 882.3 C 935.8 885.3 934.4 886.8 933.9 886.3 C 932.9 885.3 932.6 638.5 933.6 636.9 C 933.9 636.4 1041.2 636 1187.1 636 C 1408.3 636 1442.4 636.2 1458.3 637.6 C 1481.5 639.6 1491.7 641.2 1506 645 C 1510.1 646.2 1515.1 647.4 1517 647.9 C 1523.5 649.3 1550.5 659.8 1557.4 663.5 C 1559.6 664.8 1564 667.2 1567.1 668.8 C 1581.4 676.6 1599 689.3 1611.7 701.2 C 1614.5 703.8 1617.4 706 1617.9 706 C 1619.5 706 1619.4 619.8 1617.8 618.2 C 1616 616.4 617.9 616.5 616.2 618.2 Z';
const BG = '../assets/video/bg-tall.jpg';

// a soft grain for leather and suede, made here so nothing extra is downloaded
function grain(size = 256, amount = 40, seed = 1){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), d = g.createImageData(size, size); let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < size * size; i++) { const v = 128 + (rnd() - .5) * amount; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  g.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(.004, .004); return t;
}

const STYLES = [
  {name: 'فضي لامع', note: 'الحالي في الموقع، للمقارنة', now: true, motion: 'fade',
    mat: () => new THREE.MeshPhysicalMaterial({color: '#f4f2ee', metalness: 1, roughness: .14, clearcoat: .8, clearcoatRoughness: .1, envMapIntensity: 3.2})},
  {name: 'ذهبي شامبين مصقول', note: 'معدن ذهبي ناعم، يلف لفة كاملة ببطء', motion: 'spin',
    mat: () => new THREE.MeshPhysicalMaterial({color: '#d9b878', metalness: 1, roughness: .28, clearcoat: .6, clearcoatRoughness: .2, envMapIntensity: 2.6})},
  {name: 'جلد كونياك', note: 'نفس لون الجلد اللي في الفيديو، بملمس جلد، يميل يمين ويسار', motion: 'sway',
    mat: () => { const b = grain(256, 70, 7); return new THREE.MeshPhysicalMaterial({color: '#6e3a1e', roughness: .7, sheen: .3, sheenRoughness: .6, sheenColor: '#b07a52', bumpMap: b, bumpScale: 2.5, clearcoat: .15, clearcoatRoughness: .6, envMapIntensity: .8}); }},
  {name: 'أسود لامع بأطراف ذهبية', note: 'وجه أسود مثل البيانو وجوانب ذهبية، يمر عليه ضوء', motion: 'sweep',
    mat: () => [new THREE.MeshPhysicalMaterial({color: '#0c0c0e', metalness: .2, roughness: .08, clearcoat: 1, clearcoatRoughness: .04, envMapIntensity: 1.6}),
                new THREE.MeshPhysicalMaterial({color: '#d4af6a', metalness: 1, roughness: .22, envMapIntensity: 2.4})]},
  {name: 'كريستال', note: 'زجاج شفاف ينكسر فيه الفيديو اللي وراه، يتمايل بهدوء', motion: 'rock',
    mat: () => new THREE.MeshPhysicalMaterial({color: '#ffffff', metalness: 0, roughness: .04, transmission: 1, thickness: 60, ior: 1.5, attenuationColor: '#f3e2c8', attenuationDistance: 400, clearcoat: 1, envMapIntensity: 1.4, specularIntensity: 1})},
  {name: 'سويد عنابي', note: 'من لون السويد العنابي اللي في الفيديو، مخملي، يطفو', motion: 'float',
    mat: () => { const b = grain(256, 30, 3); return new THREE.MeshPhysicalMaterial({color: '#3e0c18', roughness: 1, sheen: 1, sheenRoughness: .45, sheenColor: '#8e3a50', bumpMap: b, bumpScale: .8, envMapIntensity: .5}); }}
];

const grid = document.getElementById('grid');
grid.innerHTML = STYLES.map((s, i) => `<article class="card"><div class="stage" data-i="${i}"><canvas aria-label="TM logo, ${s.name}. Drag to turn."></canvas></div>
  <div class="meta"><span class="num">${i + 1}</span><b>${s.name}</b><span class="${s.now ? 'now' : ''}">${s.note}</span></div></article>`).join('');

const shapes = SVGLoader.createShapes(new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${TM}"/></svg>`).paths[0]);
const baseGeo = new THREE.ExtrudeGeometry(shapes, {depth: 70, bevelEnabled: true, bevelThickness: 12, bevelSize: 6, bevelSegments: 12, curveSegments: 64});
baseGeo.center(); baseGeo.rotateX(Math.PI);
const bgTex = await new THREE.TextureLoader().loadAsync(BG); bgTex.colorSpace = THREE.SRGBColorSpace;

const cards = [...document.querySelectorAll('.stage')].map(stage => {
  const s = STYLES[+stage.dataset.i], cv = stage.querySelector('canvas');
  const R = new THREE.WebGLRenderer({canvas: cv, antialias: true});
  R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  // the film still as the backdrop (cover-fitted to the square card, centred on the needle), darkened like the site's opening
  const bg = bgTex.clone(); bg.needsUpdate = true; const crop = 1080 / 1920; bg.repeat.set(1, crop); bg.offset.set(0, (1 - crop) / 2);
  scene.background = bg; scene.backgroundIntensity = .62;
  scene.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .6;
  const cam = new THREE.PerspectiveCamera(32, 1, .1, 60); cam.position.set(0, 0, 9);
  const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(3, 4, 5); scene.add(key);
  const spot = new THREE.PointLight('#fff4e0', 30, 14); spot.position.set(1.8, 1.6, 4); scene.add(spot);
  scene.add(new THREE.AmbientLight('#ffffff', .2));
  const mesh = new THREE.Mesh(baseGeo, s.mat()); mesh.scale.setScalar(.003); scene.add(mesh);
  const st = {drag: null, ry: 0, rx: 0, vy: 0, held: 0};
  stage.addEventListener('pointerdown', e => { st.drag = {x: e.clientX, y: e.clientY, ry: st.ry, rx: st.rx}; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (!st.drag) return; st.ry = st.drag.ry + (e.clientX - st.drag.x) * .012; st.rx = Math.max(-.6, Math.min(.6, st.drag.rx + (e.clientY - st.drag.y) * .008)); });
  const up = () => { if (st.drag) { st.drag = null; st.held = performance.now() + 1500; } };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  const size = () => { const w = stage.clientWidth; R.setSize(w, w, false); };
  size(); addEventListener('resize', size);
  return {s, R, scene, cam, mesh, spot, st, stage, visible: true};
});

// only draw cards on screen (lighter on phones)
const io = new IntersectionObserver(es => es.forEach(e => { const c = cards.find(k => k.stage === e.target); if (c) c.visible = e.isIntersecting; }), {rootMargin: '100px'});
cards.forEach(c => io.observe(c.stage));

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){
  requestAnimationFrame(frame);
  const t = reduce ? 0 : now / 1000;
  for (const c of cards) {
    if (!c.visible) continue;
    const {mesh, st, s, spot} = c, free = !st.drag && now > st.held;
    let ry = 0, rx = 0, y = 0, op = 1;
    switch (s.motion) {
      case 'fade': { const k = (t % 7.1); op = k < 1.8 ? k / 1.8 : k < 4.4 ? 1 : k < 6.2 ? 1 - (k - 4.4) / 1.8 : 0; ry = Math.sin(t * .4) * .18; break; }
      case 'spin': ry = t * .55; break;
      case 'sway': ry = Math.sin(t * .8) * .55; rx = Math.sin(t * .5) * .08; break;
      case 'sweep': ry = Math.sin(t * .35) * .25; spot.position.x = Math.sin(t * .9) * 4.5; spot.position.y = 1.4; break;
      case 'rock': ry = Math.sin(t * .6) * .4; rx = Math.cos(t * .45) * .12; break;
      case 'float': y = Math.sin(t * 1.1) * .12; ry = Math.sin(t * .5) * .3; break;
    }
    if (free) { st.ry += (ry - st.ry) * .05; st.rx += (rx - st.rx) * .05; if (s.motion === 'spin') st.ry = ry; }
    mesh.rotation.set(st.rx, st.ry, 0); mesh.position.y = y;
    const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
    mats.forEach(m => { m.transparent = s.motion === 'fade'; m.opacity = op; });
    c.R.render(c.scene, c.cam);
  }
}
requestAnimationFrame(frame);
</script>
<noscript><p class="err">الصفحة تحتاج JavaScript.</p></noscript>
</body>
</html>
